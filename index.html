<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07111f">
  <meta name="description" content="TXA V20 Focus Production Edition - công cụ thống kê lịch sử Tài/Xỉu chạy ngoại tuyến.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <title>TXA V20 Focus Production Compact</title>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">TXA</div>
        <div>
          <h1>TXA <span>V20 FOCUS</span></h1>
          <p>Production Edition</p>
        </div>
      </div>
      <div class="top-actions">
        <button id="installBtn" class="icon-btn hidden" type="button" title="Cài ứng dụng">⬇</button>
        <button id="settingsBtn" class="icon-btn" type="button" title="Cài đặt">⚙</button>
      </div>
    </header>

    <main>
      <section id="signalCard" class="signal-card state-neutral" aria-live="polite">
        <div class="eyebrow">VÁN TIẾP THEO NGHIÊNG VỀ</div>
        <div id="prediction" class="prediction">CHƯA RÕ</div>
        <div id="confidenceLabel" class="confidence-pill">Chưa đủ dữ liệu</div>

        <div class="gauge-wrap" aria-label="Điểm tín hiệu">
          <div class="gauge" id="gauge"><span id="signalScore">0</span><small>/100</small></div>
          <div class="gauge-caption">ĐIỂM TÍN HIỆU</div>
        </div>

        <div class="metrics">
          <article><span>Đồng thuận</span><strong id="consensus">0/12</strong><small>Mô hình</small></article>
          <article><span>Độ ổn định</span><strong id="stability">0%</strong><small>Chuỗi gần đây</small></article>
          <article><span>Xu hướng</span><strong id="trend">—</strong><small>20 ván gần nhất</small></article>
        </div>

        <div class="history-panel">
          <div class="history-header">
            <span>20 VÁN GẦN NHẤT</span>
            <span id="totalCount">0 ván</span>
          </div>
          <div id="historyStrip" class="history-strip" aria-label="Lịch sử gần nhất"></div>
        </div>

        <div class="input-grid">
          <button class="result-btn tai" data-result="T" type="button"><strong>TÀI</strong><span>Nhập kết quả</span></button>
          <button class="result-btn xiu" data-result="X" type="button"><strong>XỈU</strong><span>Nhập kết quả</span></button>
          <button id="undoBtn" class="result-btn undo" type="button"><strong>HOÀN TÁC</strong><span>Xóa ván cuối</span></button>
        </div>

      </section>

      <p class="disclaimer">Chỉ phân tích dữ liệu lịch sử. Không bảo đảm kết quả của ván tiếp theo.</p>
    </main>
  </div>

  <dialog id="settingsDialog">
    <form method="dialog" class="dialog-card">
      <div class="dialog-head"><h2>Cài đặt</h2><button value="cancel" aria-label="Đóng">×</button></div>
      <label>Ngưỡng tín hiệu mạnh
        <input id="strongThreshold" type="range" min="60" max="90" step="1">
        <output id="strongThresholdOut"></output>
      </label>
      <label>Số mẫu tối thiểu
        <input id="minSamples" type="number" min="8" max="100" step="1">
      </label>
      <label class="switch-row"><input id="hapticsToggle" type="checkbox"> Rung phản hồi khi nhập</label>
      <div class="dialog-tools">
        <button id="backupBtn" type="button">Sao lưu JSON</button>
        <label class="file-label">Khôi phục JSON<input id="restoreInput" type="file" accept="application/json"></label>
        <button id="clearBtn" class="danger" type="button">Xóa dữ liệu</button>
      </div>
      <menu><button value="cancel">Hủy</button><button id="saveSettingsBtn" value="default">Lưu</button></menu>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
